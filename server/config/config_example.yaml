app:
  name: Avatar Agent Server
  description: Backend service for the personal AI workspace and avatar assistant.
  version: 0.1.0

server:
  host: 127.0.0.1
  port: 8000
  reload: true

logging:
  level: DEBUG
  directory: /tmp/avatar_agent_log
  file_name: server.log
  rotation: 10 MB
  retention: 30 days
  compression: gz
  console: true

database:
  url: sqlite+aiosqlite:///data/personal_agent.db

embedding:
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  dimensions: 384

codex:
  executable: codex
  workspace_root: ..
  timeout_seconds: 300

mcp:
  stdio_servers: []

llm:
  default_provider: mock
  timeout_seconds: 30
  max_output_tokens: 8192
  openai:
    model: gpt-5.6-luna
    base_url: https://api.openai.com/v1
  gemini:
    model: gemini-3.5-flash
    base_url: https://generativelanguage.googleapis.com/v1beta
  deepseek:
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com
